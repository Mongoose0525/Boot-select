<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ShellChooser</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');

* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-font-smoothing:antialiased; }

html, body {
  width:100%; height:100%;
  background:#0A0C10;
  overflow:hidden;
  font-family:'Inter', sans-serif;
}

.scanlines {
  position:fixed; inset:0; pointer-events:none; z-index:5;
  background:
    radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%),
    repeating-linear-gradient(rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
}

.frame {
  position:relative;
  width:100%; height:100%;
  display:flex; flex-direction:column;
  transition: opacity .35s ease;
}

.frame.exiting { opacity:0; }

body.ui-locked {
    pointer-events: none;
}

body.ui-locked button,
body.ui-locked input {
    pointer-events: none;
}

.topbar {
  display:flex; justify-content:space-between; align-items:center;
  padding: 3.2vh 4vw 0;
  font-family:'IBM Plex Mono', monospace;
  color:#6B7280;
  letter-spacing:0.18em;
  font-size:12px;
  transition: opacity .35s ease;
}

.topbar .label { color:#8b91a0; }
.topbar .label b { color:#8b91a0; font-weight:500; letter-spacing:0.18em; }

.stage {
  flex:1;
  display:flex; align-items:center; justify-content:center;
  gap:6vw;
  position:relative;
}

.tile {
  --accent:#FFFFFF;
  position:relative;
  width:min(22vw, 300px);
  background:#14181F;
  border:1px solid #22262f;
  border-radius:6px;
  padding:5vh 0 0;
  display:flex; flex-direction:column; align-items:center;
  cursor:pointer;
  outline:none;
  transition: border-color .18s ease, background .18s ease, transform .18s ease, opacity .4s ease;
}

/* Mouse-only visual feedback — pure CSS, no JS state involved */
.tile:hover {
  border-color: var(--accent);
  background:#171b23;
  transform: translateY(-4px);
}

.tile:hover .icon-wrap {
  opacity:1;
  transform:scale(1);
  filter: drop-shadow(0 0 16px rgba(255,255,255,0.55));
}

.tile:hover .meter-fill {
  width:100%;
  transition: width 0.5s cubic-bezier(.2,.7,.3,1);
}


/* Keyboard / gamepad selection — driven by .selected, independent of mouse */
.tile.selected {
  border-color: var(--accent);
  background:#171b23;
  transform: translateY(-4px);
}

.tile.selected .icon-wrap {
  opacity:1;
  transform:scale(1);
  filter: drop-shadow(0 0 16px rgba(255,255,255,0.55));
}

.tile.selected .meter-fill {
  width:100%;
  transition: width 0.5s cubic-bezier(.2,.7,.3,1);
}

body.input-mode-keys .tile:hover:not(.selected) {
  border-color:#22262f;
  background:#14181F;
  transform:none;
}
body.input-mode-keys .tile:hover:not(.selected) .icon-wrap {
  opacity:0.4;
  transform:scale(0.82);
  filter:none;
}
body.input-mode-keys .tile:hover:not(.selected) .meter-fill {
  width:0%;
}

.icon-wrap {
  width:96px; height:96px;
  display:flex; align-items:center; justify-content:center;
  opacity:0.4;
  transform:scale(0.82);
  transition: opacity .2s ease, transform .25s cubic-bezier(.2,.7,.3,1.4), filter .2s ease;
}

.icon-wrap img {
  width:70%; height:70%;
  object-fit:contain;
}

.tile .name {
  margin-top:2.6vh;
  font-size:18px;
  font-weight:500;
  color:#E6E8EB;
  letter-spacing:0.01em;
}

.tile .sub {
  margin-top:0.5vh;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:0.12em;
  color:#565c69;
  text-transform:uppercase;
  margin-bottom:4.5vh;
}

.meter {
  width:100%;
  height:3px;
  background:#1c2028;
  border-radius:0 0 6px 6px;
  overflow:hidden;
}

.meter-fill {
  height:100%;
  width:0%;
  background:#FFFFFF;
  box-shadow:0 0 8px rgba(255,255,255,0.6);
  transition: width .18s ease;
}

/* ---- confirm sequence ---- */

.tile.dismissed {
  opacity:0;
  transform: scale(0.8) translateY(-4px);
  pointer-events:none;
  transition: opacity .4s ease, transform .4s ease;
}

.tile.chosen {
  z-index:10;
  transition: transform .55s cubic-bezier(.22,.9,.32,1), border-color .18s ease, background .18s ease;
}

.tile.chosen .meter { opacity:0; transition: opacity .2s ease; }

.hint {
  position: relative;
  bottom: 0;
  text-align: center;
  padding: 0 12px 4vh;
  font-family: 'IBM Plex Mono', monospace;
  font-size: clamp(10px, 0.8vw, 15px);
  letter-spacing: 0.12em;
  color: #969696;
  transition: opacity .3s ease, bottom .25s ease;
  min-height: 1em;
  max-width: 100%;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* Less vertical space */
@media (max-height: 800px) {
  .hint {
    bottom: 20px;
    padding-bottom: 2vh;
  }
}

@media (max-height: 650px) {
  .hint {
    bottom: 40px;
    padding-bottom: 1vh;
  }
}

@media (max-height: 500px) {
  .hint {
    bottom: 60px;
    padding-bottom: 0;
  }
}

.hint kbd {
  color: #8b91a0;
  border: 1px solid #2a2f3a;
  border-radius: 3px;
  padding: 1px 6px;
  font-family: 'IBM Plex Mono', monospace;
  margin: 0 2px;
  flex-shrink: 0;
}

.hint .gp-name {
  margin-left: 8px;
  color: #3a3f4b;
}
/* Custom ShellChooser cursor */

body:not(.legacy-cursor):not(.cursor-hidden),
body:not(.legacy-cursor):not(.cursor-hidden) * {
    cursor: url("./Assets/Icons/Cursor.svg") 4 2, auto !important;
}
/* default hover variant */
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="triangle"] button:hover,
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="triangle"] button:hover *,
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="triangle"] input:hover,
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="triangle"] .toggle-switch:hover,
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="triangle"] .toggle-switch:hover * {
    cursor: url("./Assets/Icons/Cursor50.svg") 4 2, auto !important;
}
/* Arrow cursor */
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="arrow"],
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="arrow"] * {
    cursor: url("./Assets/Icons/CursorArrow.svg") 4 2, auto !important;
}
/* Arrow hover variant */
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="arrow"] button:hover,
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="arrow"] button:hover *,
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="arrow"] input:hover,
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="arrow"] .toggle-switch:hover,
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="arrow"] .toggle-switch:hover * {
    cursor: url("./Assets/Icons/CursorArrow50.svg") 4 2, auto !important;
}
/* Circle cursor */
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="circle"],
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="circle"] * {
    cursor: url("./Assets/Icons/CursorCircle.svg") 16 16, auto !important;
}
/* Circle hover variant */
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="circle"] button:hover,
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="circle"] button:hover *,
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="circle"] input:hover,
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="circle"] .toggle-switch:hover,
body:not(.legacy-cursor):not(.cursor-hidden)[data-cursor-style="circle"] .toggle-switch:hover * {
    cursor: url("./Assets/Icons/CursorCircle25.svg") 16 16, auto !important;
}
/* Hide Windows cursor */
body.cursor-hidden,
body.cursor-hidden * {
    cursor: none !important;
}
/* Power setting tab */
.settings-tab-button {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 11px;
    margin-top: 4px;

    background: transparent;
    border: none;
   /* border-top: 1px solid #2a2f3a; */
    border-radius: 3px;

    color: #8b91a0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-align: left;
    cursor: pointer;

    transition: background .15s ease, color .15s ease;
}

body:not(.input-mode-keys) .settings-tab-button:hover,
body.input-mode-keys .settings-tab-button:focus {
    background: #222833;
    color: #E6E8EB;
}

body.input-mode-keys .settings-tab-button:focus {
    outline: 2px solid #E6E8EB;
    outline-offset: 2px;
}

body:not(.input-mode-keys) .settings-tab-button:focus {
    outline: none;
}

.settings-tab-arrow {
    font-size: 17px;
    line-height: 10px;
    transition: transform .25s ease;
}

.settings-tab-button[aria-expanded="true"] .settings-tab-arrow {
    transform: rotate(90deg);
}

.power-settings-panel {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    pointer-events: none;

    transition:
        max-height .25s ease,
        opacity .2s ease;
}

.power-settings-panel.open {
    max-height: 110px;
    opacity: 1;
    pointer-events: auto;
}
.power-settings-panel {
    background: #10141A;
    border-left: 2px solid #343B48;
    margin-left: 5px;
    margin-right: 5px;
    border-radius: 0 0 3px 3px;
}

.power-settings-panel.open {
    max-height: 110px;
    opacity: 1;
    pointer-events: auto;
    margin-top: 2px;
    margin-bottom: 4px;
}

.power-settings-panel .power-setting {
    padding: 8px 8px;
    margin-top: 0;
    border-top: 1px solid #202630;
}

.power-settings-panel .power-setting:first-child {
    border-top: none;
}
/* Cursor style selector */

.cursor-style-setting {
    padding: 7px 11px;
    border-top: 1px solid #2a2f3a;
    margin-top: 4px;
    display: flex;
    flex-direction: column;
    gap: 6px;

    max-height: 100px;
    opacity: 1;
    overflow: hidden;
    transform: translateY(0);

    transition:
        max-height .25s ease,
        opacity .2s ease,
        transform .25s ease,
        padding .25s ease,
        margin .25s ease,
        border-width .25s ease;
}

body.legacy-cursor .cursor-style-setting {
    max-height: 0;
    opacity: 0;
    transform: translateY(-8px);
    padding-top: 0;
    padding-bottom: 0;
    margin-top: 0;
    border-top-width: 0;
    pointer-events: none;
}

.cursor-style-setting > label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: #8b91a0;
    letter-spacing: 0.08em;
}

.cursor-style-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
}

.cursor-choice,
.cursor-placeholder {
    width: 100%;
    height: 30px;
    background: #171b23;
    border: 1px solid #303744;
    border-radius: 4px;
}

.cursor-choice {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
}

.cursor-choice img {
    width: 19.6px;
    height: 19.6px;
    object-fit: contain;
}

body:not(.input-mode-keys) .cursor-choice:hover {
    background: #222833;
    border-color: #8b91a0;
}

.cursor-choice.selected {
    background: #222833;
    border-color: #E6E8EB;
}

body.input-mode-keys .cursor-choice:focus {
    outline: 2px solid #E6E8EB;
    outline-offset: 3px;
}

.cursor-placeholder {
    opacity: 0.35;
    border-style: dashed;
    pointer-events: none;
}
/* battery */
.battery-icon {
    position: relative;
    width: 25px;
    height: 13px;
    border: 1.5px solid #8b91a0;
    border-radius: 3px;
    padding: 2px;
}

.battery-icon::after {
    content: "";
    position: absolute;
    right: -4px;
    top: 3px;
    width: 2px;
    height: 5px;
    background: #8b91a0;
}

.battery-fill {
    height: 100%;
    width: 50%;
    background: #8b91a0;
    border-radius: 1px;
    transition: width .3s ease;
}

.battery-bolt {
    display: none;
    position: absolute;
    inset: -1px 0 0;
    align-items: center;
    justify-content: center;
    color: #FACC15;
    font-size: 10px;
	filter: grayscale(1) brightness(1);
}

.battery-indicator.charging .battery-bolt {
    display: flex;
}

.status-bar {
    position: fixed;
    right: 3vw;
    bottom: 2.5vh;
    display: flex;
    align-items: center;
    gap: 20px;
    z-index: 10;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: #8b91a0;
    pointer-events: none;
}

#clock {
    color: #8b91a0;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.08em;
}

.battery-indicator {
    display: flex;
    align-items: center;
    gap: 9px;
}

.menu-container {
    position: relative;
    pointer-events: auto;
}

.menu-button {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;

    color: #8b91a0;
    font-size: 21px;
    line-height: 1;
    cursor: pointer;

    transition: background .15s ease, border-color .15s ease;
}

body:not(.input-mode-keys) .menu-button:hover,
.menu-container.open .menu-button {
    background: #171b23;
    border-color: #2a2f3a;
}
/* Hide keyboard/gamepad focus highlight while using the mouse */
body:not(.input-mode-keys) .menu-button:focus {
    outline: none;
    background: transparent;
    border-color: transparent;
}
.menu-dropdown {
    position: absolute;
    right: 0;
    bottom: calc(100% + 9px);

    min-width: 155px;
    display: none;
    flex-direction: column;
    padding: 5px;

    background: #14181F;
    border: 1px solid #2a2f3a;
    border-radius: 5px;

    box-shadow: 0 8px 24px rgba(0,0,0,.4);
}

.menu-container.open .menu-dropdown {
    display: flex;
}

.menu-option {
    width: 100%;
    padding: 9px 11px;

    background: transparent;
    border: none;
    border-radius: 3px;

    color: #8b91a0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-align: left;

    cursor: pointer;
    transition: background .15s ease, color .15s ease;
}
/* Button underglow */
.menu-option,
.power-option,
.confirm-button {
    position: relative;
    overflow: hidden;
}

.menu-option::before,
.power-option::before,
.confirm-button::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    opacity: 0;
    box-shadow: inset 0 -9px 13px -8px var(--click-glow, rgba(230, 232, 235, 0.7));
    transition: opacity .12s ease;
}

/* Short click pulse */
.menu-option.clicked::before,
.power-option.clicked::before,
.confirm-button.clicked::before {
    animation: dropdownClickGlow .25s ease-out;
}

/* Persistent glow while holding */
.power-option.hold-active::before,
.confirm-button.hold-active::before {
    opacity: 1;
}

@keyframes dropdownClickGlow {
    0%   { opacity: 0; }
    30%  { opacity: 0.75; }
    100% { opacity: 0; }
}
.menu-option {
    --click-glow: rgba(230, 232, 235, 0.7);
}

.power-option[data-power="shutdown"],
.confirm-dialog[data-action="shutdown"] #power-confirm-yes {
    --click-glow: rgba(229, 115, 115, 0.85);
}

.power-option[data-power="restart"],
.confirm-dialog[data-action="restart"] #power-confirm-yes {
    --click-glow: rgba(229, 196, 106, 0.85);
}

.power-option[data-power="logoff"],
.confirm-dialog[data-action="logoff"] #power-confirm-yes {
    --click-glow: rgba(230, 232, 235, 0.8);
}

#power-confirm-no {
    --click-glow: rgba(230, 232, 235, 0.7);
}
/* Mouse mode */
body:not(.input-mode-keys) .menu-option:hover {
    background: #222833;
    color: #E6E8EB;
}

/* Keyboard / gamepad mode */
body.input-mode-keys .menu-option:focus {
    background: #222833;
    color: #E6E8EB;
}

body.input-mode-keys .menu-button:focus,
body.input-mode-keys .menu-option:focus {
    outline: 2px solid #E6E8EB;
    outline-offset: 4px;
}
/* Hide dropdown focus outline while using the mouse */
body:not(.input-mode-keys) .menu-button:focus-visible,
body:not(.input-mode-keys) .menu-option:focus-visible {
    outline: none;
}
/* ---- Power menu ---- */

body:not(.input-mode-keys) .power-button:hover,

}

body:not(.input-mode-keys) .power-button:focus {
    outline: none;
    background: transparent;

}

.power-dropdown {
    position: absolute;
    left: 0;
    bottom: calc(100% + 9px);

    min-width: 155px;
    display: none;
    flex-direction: column;
    padding: 5px;

    background: #14181F;
    border: 1px solid #2a2f3a;
    border-radius: 5px;

    box-shadow: 0 8px 24px rgba(0,0,0,.4);
}

.power-container.open .power-dropdown {
    display: flex;
}

.power-option {
    width: 100%;
    padding: 9px 11px;

    background: transparent;
    border: none;
    border-radius: 3px;

    color: #8b91a0;
    font-family: 'IBM Plex Mono', monospace;

    cursor: pointer;

body:not(.input-mode-keys) .power-option:hover,
body.input-mode-keys .power-option:focus {
    background: #222833;
    color: #E6E8EB;
}

body.input-mode-keys .power-button:focus {
    outline: 2px solid #E6E8EB;
    outline-offset: 4px;

body.input-mode-keys .power-option:focus {
    outline: 2px solid var(--power-accent);

body:not(.input-mode-keys) .power-option:focus-visible {
    outline: none;
}

.power-option {
    display: flex;
    align-items: center;
    gap: 10px;
}

.dropdown-icon {
    width: 15px;
    height: 15px;
    object-fit: contain;
    flex-shrink: 0;
    opacity: 0.65;
    transition: opacity .15s ease;
}


/* Power option accent colors */
.power-option[data-power="shutdown"] {
    --power-accent: #E57373;
}

.power-option[data-power="restart"] {
    --power-accent: #E5C46A;
}

.power-option[data-power="logoff"] {
    --power-accent: #E6E8EB;
}

/* Mouse hover and keyboard/gamepad selection */
body:not(.input-mode-keys) .power-option:hover,
body.input-mode-keys .power-option:focus {
    background: #222833;
    color: var(--power-accent);
}

/* Match icon color to the option */


/* Apply the accent to SVG icons */
.dropdown-icon {
    width: 15px;
    height: 15px;
    object-fit: contain;
    flex-shrink: 0;
    opacity: 0.65;
    filter: brightness(0) invert(0.65);
    transition: opacity .15s ease, filter .15s ease;
}

/* Shutdown — red */
body:not(.input-mode-keys) .power-option[data-power="shutdown"]:hover .dropdown-icon,
body.input-mode-keys .power-option[data-power="shutdown"]:focus .dropdown-icon {
    opacity: 1;
    filter: brightness(0) saturate(100%) invert(56%) sepia(24%) saturate(1114%) hue-rotate(314deg) brightness(94%);
}

/* Restart — yellow */
body:not(.input-mode-keys) .power-option[data-power="restart"]:hover .dropdown-icon,
body.input-mode-keys .power-option[data-power="restart"]:focus .dropdown-icon {
    opacity: 1;
    filter: brightness(0) saturate(100%) invert(79%) sepia(28%) saturate(631%) hue-rotate(6deg) brightness(96%);
}

/* Log Off — light gray */
body:not(.input-mode-keys) .power-option[data-power="logoff"]:hover .dropdown-icon,
body.input-mode-keys .power-option[data-power="logoff"]:focus .dropdown-icon {
    opacity: 1;
    filter: brightness(0) invert(0.9);
}

.volume-control {
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 10px 11px 8px;
    border-top: 1px solid #2a2f3a;
    margin-top: 4px;
}

.volume-control label {
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: #8b91a0;
    letter-spacing: 0.08em;
}

#volume-value {
    color: #E6E8EB;
    transition: color .2s ease;
}

.volume-slider {
    width: 100%;
    height: 4px;
    accent-color: #E6E8EB;
    cursor: pointer;
}
.control-value {
    color: #E6E8EB;
    transition: color .2s ease;
}
/* muted */
#system-volume-control.is-zero label,

}

/* Shut down prompt setting */

.power-setting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 10px 11px;
    margin-top: 4px;
    border-top: 1px solid #2a2f3a;
}

.power-setting > label:first-child {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: #8b91a0;
    letter-spacing: 0.08em;
}

/* Toggle switch */

.toggle-switch {
    position: relative;
    display: inline-flex;
    width: 32px;
    height: 18px;
    flex-shrink: 0;
    cursor: pointer;
}

.toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.toggle-track {
    position: absolute;
    inset: 0;
    background: #303744;
    border: 1px solid #454d5b;
    border-radius: 20px;
    transition: background .2s ease, border-color .2s ease;
}

.toggle-track::before {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    left: 3px;
    top: 3px;
    background: #8b91a0;
    border-radius: 50%;
    transition: transform .2s ease, background .2s ease;
}

.toggle-switch input:checked + .toggle-track {
    background: #E6E8EB;
    border-color: #E6E8EB;
}

.toggle-switch input:checked + .toggle-track::before {
    transform: translateX(14px);
    background: #14181F;
}

.toggle-switch input:focus-visible + .toggle-track {
    outline: 2px solid #E6E8EB;
    outline-offset: 3px;
}
body.input-mode-keys .toggle-switch input:focus + .toggle-track {
    outline: 2px solid #E6E8EB;
    outline-offset: 3px;
}
/* Steam desktop mode + console toggle */

.steam-tile-wrapper {
    position: relative;
    width: min(22vw, 300px);
}

.steam-tile-wrapper .tile {
    width: 100%;
}

.steam-desktop-option {
    position: absolute;
    top: calc(100% + 18px);
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;

    width: max-content;
    white-space: nowrap;

    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: #8b91a0;

    visibility: hidden;
    pointer-events: none;

    transition: opacity .2s ease, color .2s ease;
}

.steam-tile-wrapper.option-visible .steam-desktop-option {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.steam-desktop-option:has(input:checked) {

}

.steam-desktop-option .toggle-switch {
    width: 32px;
    height: 18px;

.steam-tile-wrapper:not(.console-option-enabled) .steam-desktop-option {
    display: none;

/* ---------- Power confirmation dialog ---------- */

.confirm-overlay {

    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.55);

}

.confirm-overlay.open {
    display: flex;
}

.confirm-dialog {
    width: min(400px, 90vw);

.confirm-title {
    font-size: 16px;

    color: #E6E8EB;

}

.confirm-message {

    color: #A5ABB7;
    line-height: 1.6;
    margin-bottom: 25px;
}

.confirm-buttons {

    justify-content: flex-end;
    gap: 10px;
}

.confirm-button {
    min-width: 85px;
    padding: 9px 16px;
    background: #222833;
    border: 1px solid #343B48;
    border-radius: 4px;
    color: #E6E8EB;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
}

/* Hold-to-confirm progress indicator */

.power-option,
.confirm-button {
    position: relative;
    overflow: hidden;
}

.power-option::after,
.confirm-button::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0%;
    height: 2px;
    background: var(--power-accent, var(--confirm-accent, #E6E8EB));
    z-index: 1;
}

body.input-mode-keys .power-option:focus {
    outline: 2px solid var(--power-accent);
    outline-offset: 2px;
}

.power-option.hold-active::after,
.confirm-button.hold-active::after {
    animation: holdProgress 0.5s linear forwards;
}

@keyframes holdProgress {
    from { width: 0%; }
    to { width: 100%; }
}
/* Mouse mode */
body:not(.input-mode-keys) .confirm-button:hover {
    background: #303947;
    border-color: #8b91a0;
    outline: none;
}

/* Keyboard / gamepad mode */
body.input-mode-keys .confirm-button.selected {
    background: #303947;
    border-color: #8b91a0;
    outline: none;
}

/* Ignore mouse hover while using keyboard/gamepad */
body.input-mode-keys .confirm-button:hover:not(.selected) {
    background: #222833;
    border-color: #343B48;
}

body:not(.input-mode-keys) .confirm-button:focus {

}

/* Yes button accent depends on the selected power action */
.confirm-dialog[data-action="shutdown"] #power-confirm-yes {

}

.confirm-dialog[data-action="restart"] #power-confirm-yes {

@keyframes dialogIntro {

/* ---- Intro animation ---- */

.frame {

<script>

    const soundFiles = {

    win10vol: "./Assets/Sfx/Win10/Windows Background.wav",
};
const volumeSlider = document.getElementById("volume-slider");
const volumeValue = document.getElementById("volume-value");
function toggleMute(slider, storageKey, scale = 1) {
    const currentVolume = Number(slider.value);
    const storedVolume = localStorage.getItem(storageKey);

    if (currentVolume > 0) {
        localStorage.setItem(storageKey, currentVolume / scale);
        slider.value = 0;
    } else {
        const savedVolume = storedVolume === null
            ? NaN
            : Number(storedVolume);

        const restoreVolume = Number.isFinite(savedVolume) && savedVolume > 0
            ? savedVolume * scale
            : 50;

        slider.value = Math.min(Number(slider.max), restoreVolume);
    }

    slider.dispatchEvent(new Event("input"));
    if (sliderRepeatTarget === systemVolumeSlider) {
        playSound("win10vol");
    } else {
        playSound("volume");
    }
    
}
function getActiveSlider() {
    const active = document.activeElement;

    return active?.classList.contains("volume-slider")
        ? active
        : null;
}
let sliderRepeatInterval = null;
let sliderRepeatDirection = null;
let sliderRepeatTarget = null;

function adjustFocusedSlider(slider, direction) {
    const previous = Number(slider.value);
    const step = 5;

    const value = Math.max(
        Number(slider.min),
        Math.min(Number(slider.max), previous + direction * step)
    );

    if (value === previous) return;

    slider.value = value;
    slider.dispatchEvent(new Event("input"));

    playSound(
        slider === brightnessSlider ? "misc" : "volume"
    );
}

function startSliderRepeat(slider, direction) {
    if (
        sliderRepeatTarget === slider &&
        sliderRepeatDirection === direction
    ) return;

    stopSliderRepeat();

    sliderRepeatTarget = slider;
    sliderRepeatDirection = direction;

    adjustFocusedSlider(slider, direction);

    sliderRepeatInterval = setInterval(() => {
        adjustFocusedSlider(slider, direction);
    }, 100);
}

function stopSliderRepeat() {
    if (sliderRepeatTarget === systemVolumeSlider) {
        playSound("win10vol");
    }
    clearInterval(sliderRepeatInterval);

    sliderRepeatInterval = null;
    sliderRepeatDirection = null;
    sliderRepeatTarget = null;
}
const savedVolume = localStorage.getItem("shellChooserVolume");
const savedUnmutedVolume = localStorage.getItem("shellChooserUnmutedVolume");


let uiVolume = savedVolume === null
    ? 0.5
    : Math.max(0, Math.min(1, Number(savedVolume)));

if (!Number.isFinite(uiVolume)) uiVolume = 0.5;

let lastUnmutedVolume = savedUnmutedVolume === null
    ? (uiVolume > 0 ? uiVolume : 0.5)
    : Math.max(0.05, Math.min(1, Number(savedUnmutedVolume)));

if (!Number.isFinite(lastUnmutedVolume)) {
    lastUnmutedVolume = 0.5;
}

const sounds = {};

for (const [name, path] of Object.entries(soundFiles)) {
    sounds[name] = new Audio(path);
    sounds[name].preload = "auto";
}

function setUiVolume(value) {
    uiVolume = Math.max(0, Math.min(1, value));

    if (uiVolume > 0) {
        lastUnmutedVolume = uiVolume;
        localStorage.setItem(
            "shellChooserUnmutedVolume",
            lastUnmutedVolume
        );
    }

    document.getElementById("ui-volume-control")
    .classList.toggle("is-zero", uiVolume === 0);
    localStorage.setItem("shellChooserVolume", uiVolume);
}

// ---------- Windows system controls ----------

const systemVolumeSlider =
    document.getElementById("system-volume-slider");

const systemVolumeValue =

const systemVolumeControl =

const brightnessSlider =
    document.getElementById("brightness-slider");

const brightnessValue =
    document.getElementById("brightness-value");

const brightnessControl =
    document.getElementById("brightness-control");


function updateSystemControlUI(slider, label, container, value) {
    slider.value = value;
    label.textContent = `${value}%`;

    container.classList.toggle("is-zero", Number(value) <= 0);
}


async function initializeSystemControls() {
    if (!window.pywebview || !window.pywebview.api) return;

    // SYSTEM VOLUME
    try {
        const volume = await window.pywebview.api.get_system_volume();

        if (volume !== null && volume !== undefined) {
            updateSystemControlUI(
                systemVolumeSlider,
                systemVolumeValue,
                systemVolumeControl,
                volume
            );
        } else {
            systemVolumeSlider.disabled = true;
            systemVolumeValue.textContent = "Unavailable";
        }
    } catch (error) {
        console.error("[VOLUME] Initialization failed:", error);
        systemVolumeSlider.disabled = true;
        systemVolumeValue.textContent = "Unavailable";
    }

    // SCREEN BRIGHTNESS
    try {
        const supported =
            await window.pywebview.api.can_control_brightness();

        if (!supported) {
            brightnessControl.style.display = "none";
            return;
        }

        const brightness =
            await window.pywebview.api.get_screen_brightness();

        if (brightness !== null && brightness !== undefined) {
            updateSystemControlUI(
                brightnessSlider,
                brightnessValue,
                brightnessControl,
                brightness
            );

            brightnessControl.style.display = "flex";
        } else {
            brightnessControl.style.display = "none";
        }

    } catch (error) {
        console.error("[BRIGHTNESS] Initialization failed:", error);
        brightnessControl.style.display = "none";
    }
}


systemVolumeSlider.addEventListener("input", async () => {
    const value = Number(systemVolumeSlider.value);

    updateSystemControlUI(
        systemVolumeSlider,
        systemVolumeValue,
        systemVolumeControl,
        value
    );

    try {
        await window.pywebview.api.set_system_volume(value);
    } catch (error) {
        console.error("[VOLUME] Update failed:", error);
    }
});


brightnessSlider.addEventListener("input", async () => {
    const value = Number(brightnessSlider.value);

    updateSystemControlUI(
        brightnessSlider,
        brightnessValue,
        brightnessControl,
        value
    );

    try {
        await window.pywebview.api.set_screen_brightness(value);
    } catch (error) {
        console.error("[BRIGHTNESS] Update failed:", error);
    }
});

function playSound(name, skip = 0) {
    if (stopsound) return;

    audio.play().catch(() => {});
}
  const tiles = Array.from(document.querySelectorAll(".tile"));

  const BINDS = {
      left:  ["ArrowLeft", "a"],

      confirm: ["Enter", "ArrowUp", "z", "y", "w", "e"],

      const dropdown = getActiveDropdown();

  function isBind(bind, key) {

              const cursors = Array.from(cursorChoices);

              cursors[
                  (current + delta + cursors.length) % cursors.length
              ].focus();

      }
      // Dropdown navigation
      const activeDropdown = getActiveDropdown();

      if (activeDropdown) {
         const options = getDropdownOptions();
        
         const activeSlider = getActiveSlider();
          
          if (activeSlider) {
              if (isBind("left", e.key)) {

                  const current = options.indexOf(activeSlider);

                  options[(next + options.length) % options.length].focus();
              }
          
              return;

            const current = options.indexOf(document.activeElement);
            if (isBind("down", e.key)) {

      // Status bar navigation
      if (focusZone === "status") {

function pollGamepad() {
      const pads = navigator.getGamepads
          ? navigator.getGamepads()
          : [];

      // Find the first connected controller, regardless of slot.
      const gp = pads
          ? Array.from(pads).find(pad => pad && pad.connected)
          : null;
          if (locked) {
              requestAnimationFrame(pollGamepad);
              return;
          }

      if (gp) {
          if (!gpConnected) {
              setGamepadConnected(gp.id);
          }
          const axisX = gp.axes[0] || 0;
          const axisY = gp.axes[1] || 0;

          const left =
              axisX < -GP_DEADZONE ||
              (gp.buttons[14] && gp.buttons[14].pressed);

          const right =
              axisX > GP_DEADZONE ||
              (gp.buttons[15] && gp.buttons[15].pressed);

          const up =
              axisY < -GP_DEADZONE ||
              (gp.buttons[12] && gp.buttons[12].pressed);

          const down =
              axisY > GP_DEADZONE ||
              (gp.buttons[13] && gp.buttons[13].pressed);

          const confirm = gp.buttons[0] && gp.buttons[0].pressed;
          const cancel = gp.buttons[1] && gp.buttons[1].pressed;
          const start = gp.buttons[9] && gp.buttons[9].pressed;

         // A / Cross
         const holdTarget = document.activeElement;
         
         if (holdPowerEnabled && isPowerHoldButton(holdTarget)) {
             if (confirm && !gpPrevConfirm) {
                 beginPowerHold(holdTarget);
             }
         
             if (!confirm && gpPrevConfirm) {
                 endPowerHold(holdTarget);
             }
            } else if (confirm && !gpPrevConfirm) {
                if (confirming && document.activeElement === steamDesktopToggle) {
                    steamDesktopToggle.click();
                } else if (focusZone === "status") {
                    const activeSlider = getActiveSlider();
                
                    if (activeSlider === volumeSlider) {
                        toggleMute(volumeSlider, "shellChooserUnmutedVolume", 100);
                    } else if (activeSlider === systemVolumeSlider) {
                        toggleMute(systemVolumeSlider, "shellChooserSystemUnmutedVolume");
                    } else {
                        document.activeElement.click();
                    }
                } else {
                    confirmSelection();
                }
            }

          // Start button
        if (start && !gpPrevStart &&
            (menuContainer.classList.contains("open") ||
             powerContainer.classList.contains("open"))) {
            document.activeElement.click();
        }
        
        // B / Circle
        if (cancel && !gpPrevCancel) {
            if (powerConfirmOpen) {
                closePowerConfirm();
            } else if (menuContainer.classList.contains("open")) {
                closeMenu();
                menuButton.focus();
            } else if (confirming) {
                cancelSelection();
            } else if (focusZone === "status") {
                focusTile();
            }
        }
        if (
            confirming &&
            pendingChoice === "steam" &&
            steamDesktopConsoleAvailable
        ) {
            if (down && !gpPrevDown && document.activeElement !== steamDesktopToggle) {
                steamDesktopToggle.focus();
            } else if (up && !gpPrevUp && document.activeElement === steamDesktopToggle) {
                pendingTile.focus();
            }
        }
        if (!confirming) {
            const menuOpen = menuContainer.classList.contains("open");
            const powerOpen = powerContainer.classList.contains("open");
        
            if (powerConfirmOpen) {
                if ((left && !gpPrevLeft) || (right && !gpPrevRight)) {
                    if (document.activeElement === powerConfirmYes) {
                        powerConfirmNo.focus();
                    } else {
                        powerConfirmYes.focus();
                    }
                }
            } else if (menuOpen || powerOpen) {
                const activeSlider = getActiveSlider();
                
                if (menuOpen && activeSlider) {
                    if (left && !right) {
                        startSliderRepeat(activeSlider, -1);
                    } else if (right && !left) {
                        startSliderRepeat(activeSlider, 1);
                    } else {
                        stopSliderRepeat();
                    }
                } else {
                    stopSliderRepeat();
                }
                // Left / Right navigation
                if (
                    menuOpen &&
                    document.activeElement.classList.contains("cursor-choice")
                ) {
                    if (left && !gpPrevLeft) {
                        const cursors = Array.from(cursorChoices);
                        const current = cursors.indexOf(document.activeElement);
                
                        cursors[
                            (current - 1 + cursors.length) % cursors.length
                        ].focus();
                    }
                
                    if (right && !gpPrevRight) {
                        const cursors = Array.from(cursorChoices);
                        const current = cursors.indexOf(document.activeElement);
                
                        cursors[(current + 1) % cursors.length].focus();
                    }
                } else if (
                    left && !gpPrevLeft &&
                    menuOpen &&
                    !document.activeElement.classList.contains("volume-slider")
                ) {
                    closeMenu();
                    powerButton.focus();
                }
                
                // Right: power dropdown -> menu button
                if (right && !gpPrevRight && powerOpen) {
                    closePowerMenu();
                    menuButton.focus();
                }
        
                if (up && !gpPrevUp) {
                    if (menuOpen) moveMenuOption(-1);
                    else movePowerOption(-1);
                }
        
                if (down && !gpPrevDown) {
                    if (menuOpen) moveMenuOption(1);
                    else movePowerOption(1);
                }
            } else if (focusZone === "status") {
                if (left && !gpPrevLeft) {
                    if (document.activeElement === menuButton) {
                        powerButton.focus();
                    } else {
                        focusTile();
                    }
                }
        
                if (right && !gpPrevRight) {
                    if (document.activeElement === powerButton) {
                        menuButton.focus();
                    } else {
                        menuButton.focus();
                    }
                }
        
                if (down && !gpPrevDown) {
                    if (document.activeElement === powerButton) {
                        powerButton.click();
                    } else {
                        menuButton.click();
                    }
                }
        
                if (up && !gpPrevUp) {
                    focusTile();
                }
            } else {
                if (left && !gpPrevLeft) {
                    moveSelection(-1);
                    tiles[selectedIndex].focus();
                }
        
                if (right && !gpPrevRight) {
                    moveSelection(1);
                    tiles[selectedIndex].focus();
                }
        
                if (down && !gpPrevDown) {
                    focusStatus();
                }
            }
        }

        gpPrevLeft = left;
        gpPrevRight = right;
        gpPrevUp = up;
        gpPrevDown = down;
        gpPrevConfirm = confirm;
        gpPrevCancel = cancel;
        gpPrevStart = start;

    } else {
        if (gpConnected) {
            setGamepadDisconnected();
        }

        // Reset button states after disconnecting.
        gpPrevLeft = false;
        gpPrevRight = false;
        gpPrevUp = false;
        gpPrevDown = false;
        gpPrevConfirm = false;
        gpPrevCancel = false;
        gpPrevStart = false;
    }
	requestAnimationFrame(pollGamepad);
}

const batteryPercent = document.getElementById("battery-percent");
const batteryFill = document.getElementById("battery-fill");
const batteryIndicator = document.getElementById("battery-indicator");

async function initBattery() {
    try {
        // Ask Python whether this device has a battery
        const available = await window.pywebview.api.has_battery();

        // No battery detected: hide the entire indicator
        if (!available) {
            batteryIndicator.style.display = "none";
            return;
        }

        // Python detected a battery, but the browser API is unavailable
        if (!navigator.getBattery) {
            batteryIndicator.style.display = "none";
            return;
        }

        // Retrieve battery information
        const battery = await navigator.getBattery();

        function updateBattery() {
            const percent = Math.round(battery.level * 100);

            batteryPercent.textContent = percent + "%";
            batteryFill.style.width = percent + "%";

            batteryIndicator.classList.toggle(
                "charging",
                battery.charging
            );
        }

        updateBattery();

        battery.addEventListener("levelchange", updateBattery);
        battery.addEventListener("chargingchange", updateBattery);

    } catch (err) {
        batteryIndicator.style.display = "none";
        console.error("Battery detection failed:", err);
    }
}

// Wait until pywebview exposes its Python API
window.addEventListener("pywebviewready", initBattery);

// ---------- Status menu ----------

const menuContainer = document.querySelector(".menu-container");
const menuButton = document.getElementById("menu-button");
const menuDropdown = document.getElementById("menu-dropdown");
const powerSettingsButton = document.getElementById("power-settings-button");
const powerSettingsPanel = document.getElementById("power-settings-panel");

powerSettingsButton.addEventListener("click", () => {
    const isOpen = powerSettingsPanel.classList.toggle("open");

    powerSettingsButton.setAttribute("aria-expanded", isOpen);
    playSound(isOpen ? "toggleon" : "toggleoff");
    if (isOpen) {
        powerConfirmToggle.focus();
    } else {
        powerSettingsButton.focus();
    }
});
function closeMenu() {
    menuContainer.classList.remove("open");
    menuButton.setAttribute("aria-expanded", "false");
}

function openMenu() {
    menuContainer.classList.add("open");
    menuButton.setAttribute("aria-expanded", "true");

    menuDropdown.querySelector(".menu-option").focus();
}

menuButton.addEventListener("click", (e) => {
    e.stopPropagation();

    if (menuContainer.classList.contains("open")) {
        closeMenu();
    } else {
        openMenu();
    }
});
// ---------- Power confirmation ----------

const powerConfirm = document.getElementById("power-confirm");
const powerConfirmMessage = document.getElementById("power-confirm-message");
const powerConfirmYes = document.getElementById("power-confirm-yes");
const powerConfirmNo = document.getElementById("power-confirm-no");
[powerConfirmYes, powerConfirmNo].forEach(button => {
    button.addEventListener("focus", () => {
        powerConfirmYes.classList.remove("selected");
        powerConfirmNo.classList.remove("selected");

        button.classList.add("selected");
    });
});

let powerConfirmOpen = false;
let pendingPowerAction = null;
// ---------- Power confirmation setting ----------

const powerConfirmToggle = document.getElementById("power-confirm-toggle");

let confirmPowerEnabled =
    localStorage.getItem("shellChooserConfirmPower") === "true";

powerConfirmToggle.checked = confirmPowerEnabled;

powerConfirmToggle.addEventListener("change", () => {
    confirmPowerEnabled = powerConfirmToggle.checked;

    localStorage.setItem(
        "shellChooserConfirmPower",
        confirmPowerEnabled
    );
    playSound(confirmPowerEnabled ? "toggleon" : "toggleoff");
});
// ---------- Hold-to-confirm setting ----------

const holdPowerToggle = document.getElementById("hold-power-toggle");

let holdPowerEnabled =
    localStorage.getItem("shellChooserHoldPower") !== "false";

holdPowerToggle.checked = holdPowerEnabled;

holdPowerToggle.addEventListener("change", () => {
    holdPowerEnabled = holdPowerToggle.checked;

    localStorage.setItem(
        "shellChooserHoldPower",
        holdPowerEnabled
    );

    playSound(holdPowerEnabled ? "toggleon" : "toggleoff");
});
// ---------- Legacy cursor setting ----------

const legacyCursorToggle = document.getElementById("legacy-cursor-toggle");

let legacyCursorEnabled =
    localStorage.getItem("shellChooserLegacyCursor") === "true";

legacyCursorToggle.checked = legacyCursorEnabled;

document.body.classList.toggle(
    "legacy-cursor",
    legacyCursorEnabled
);

legacyCursorToggle.addEventListener("change", () => {
    legacyCursorEnabled = legacyCursorToggle.checked;

    localStorage.setItem(
        "shellChooserLegacyCursor",
        legacyCursorEnabled
    );

    document.body.classList.toggle(
        "legacy-cursor",
        legacyCursorEnabled
    );

    // Move focus away if the cursor selector is currently focused.
    if (
        legacyCursorEnabled &&
        document.activeElement.classList.contains("cursor-choice")
    ) {
        volumeSlider.focus();
    }

    playSound(legacyCursorEnabled ? "toggleon" : "toggleoff");
});


// ---------- Cursor style selector ----------

const cursorChoices = document.querySelectorAll(".cursor-choice");

let cursorStyle = localStorage.getItem("shellChooserCursorStyle") || "triangle";

function setCursorStyle(style) {
    cursorStyle = style;

    document.body.dataset.cursorStyle = style;

    cursorChoices.forEach(choice => {
        choice.classList.toggle(
            "selected",
            choice.dataset.cursor === style
        );
    });

    localStorage.setItem("shellChooserCursorStyle", style);
}

cursorChoices.forEach(choice => {
    choice.addEventListener("click", () => {
        setCursorStyle(choice.dataset.cursor);
        playSound("toggleon");
    });
});

// Restore saved cursor style
setCursorStyle(cursorStyle);

// ---------- Steam desktop mode + console setting ----------

const steamDesktopToggle = document.getElementById("steam-desktop-toggle");
const steamDesktopOption = document.querySelector(".steam-desktop-option");
const steamTileWrapper = document.querySelector(".steam-tile-wrapper");

let steamDesktopConsoleAvailable = false;
let steamDesktopConsoleEnabled = false;

async function initSteamDesktopConsole() {
    try {
        steamDesktopConsoleAvailable =
            await window.pywebview.api.steam_desktop_console_available();

        if (!steamDesktopConsoleAvailable) {
            steamDesktopToggle.checked = false;
            steamDesktopConsoleEnabled = false;

            localStorage.setItem(
                "shellChooserDesktopSteamConsole",
                "false"
            );

            return;
        }

        steamTileWrapper.classList.add("console-option-enabled");

        steamDesktopConsoleEnabled =
            localStorage.getItem("shellChooserDesktopSteamConsole") === "true";

        steamDesktopToggle.checked = steamDesktopConsoleEnabled;

    } catch (err) {
        console.error("Steam desktop console setting failed:", err);
    }
}

window.addEventListener("pywebviewready", initSteamDesktopConsole);

steamDesktopToggle.addEventListener("change", () => {
    if (!steamDesktopConsoleAvailable) {
        steamDesktopToggle.checked = false;
        return;
    }

    steamDesktopConsoleEnabled = steamDesktopToggle.checked;

    localStorage.setItem(
        "shellChooserDesktopSteamConsole",
        steamDesktopConsoleEnabled
    );

    playSound(
        steamDesktopConsoleEnabled ? "toggleon" : "toggleoff"
    );
});

steamDesktopOption.addEventListener("click", (e) => {
    e.stopPropagation();
});
function openPowerConfirm(action) {
    pendingPowerAction = action;
    powerConfirmOpen = true;
    powerConfirm.querySelector(".confirm-dialog").dataset.action = action;
    const names = {
        logoff: "log off",
        restart: "restart",
        shutdown: "shut down"
    };
    playSound("windowsSelect");
    powerConfirmMessage.textContent =
        `Are you sure you want to ${names[action]}?`;

    closePowerMenu();

    powerConfirm.classList.add("open");
    powerConfirmNo.focus();
}

function closePowerConfirm() {
    powerConfirmOpen = false;
    pendingPowerAction = null;

    powerConfirm.classList.remove("open");
    powerButton.focus();
}

async function executePowerAction(action) {
    powerConfirmOpen = false;
    powerConfirm.classList.remove("open");

    playSound("toast");
    locked = true;
    document.body.classList.add("ui-locked");

    topbar.style.opacity = 0;
    hint.style.opacity = 0;
    frame.classList.add("exiting");

    setTimeout(async () => {
        try {
            stopsound = true
            if (window.pywebview && window.pywebview.api) {
                await window.pywebview.api.power_action(action);
            } else {
                console.error("pywebview API unavailable");
            }
        } catch (err) {
            console.error("Power action failed:", err);
        }
    }, 300);
}

powerConfirmYes.addEventListener("click", () => {
    if (holdPowerEnabled) return;

    if (pendingPowerAction) {
        executePowerAction(pendingPowerAction);
    }
});

powerConfirmNo.addEventListener("click", closePowerConfirm);


/* 3 dot menu */
menuDropdown.addEventListener("click", async (e) => {
    e.stopPropagation();

    const option = e.target.closest(".menu-option");
    if (!option) return;

    const action = option.dataset.action;
    playSound("positive");

    try {
        if (window.pywebview && window.pywebview.api) {
            await window.pywebview.api.launch_action(action);
            closeMenu();
            menuButton.focus();
        } else {
            console.error("pywebview API unavailable");
        }
    } catch (err) {
        console.error("Action launch failed:", err);
    }
});

// Keep custom selection state synchronized with Tab navigation.
let lastFocusedElement = null;

document.addEventListener("focusin", (e) => {
    const tileIndex = tiles.indexOf(e.target);

    const wasTile = tiles.includes(lastFocusedElement);
    const isTile = tileIndex !== -1;

    const wasStatus = lastFocusedElement &&
        (menuContainer.contains(lastFocusedElement) ||
         powerContainer.contains(lastFocusedElement));

    const isStatus =
        menuContainer.contains(e.target) ||
        powerContainer.contains(e.target);

    if ((wasTile && isStatus) || (wasStatus && isTile)) {
        playSound("tab");
    } else if (wasStatus && isStatus && lastFocusedElement !== e.target) {
        playSound("misc");
    }

    lastFocusedElement = e.target;

    if (isTile) {
        focusZone = "tiles";
        selectedIndex = tileIndex;
        renderSelection();
    } else if (isStatus) {
        focusZone = "status";
    }
});

document.addEventListener("click", (e) => {
    if (!menuContainer.contains(e.target)) {
        const menuWasOpen = menuContainer.classList.contains("open");

        closeMenu();

        if (menuWasOpen && !e.target.closest(".status-bar")) {
            focusTile();
        }
    }
});
// ---------- Power menu ----------


const powerContainer = document.querySelector(".power-container");
const powerButton = document.getElementById("power-button");
const powerDropdown = document.getElementById("power-dropdown");
const powerButtonIcon = powerButton.querySelector(".power-icon");
function playButtonGlow(button) {
    button.classList.remove("clicked");

    // Restart animation on repeated clicks.
    void button.offsetWidth;

    button.classList.add("clicked");

    setTimeout(() => {
        button.classList.remove("clicked");
    }, 250);
}

document.querySelectorAll(
    ".menu-option, .power-option, .confirm-button"
).forEach(button => {
    button.addEventListener("click", () => {
        playButtonGlow(button);
    });
});
// ---------- Hold-to-confirm logic ----------

let powerHoldTimer = null;
let powerHoldButton = null;
let powerHoldSoundInterval = null;
function startPowerHoldSound() {
    stopPowerHoldSound();

    playSound("shutdownhold");

    powerHoldSoundInterval = setInterval(() => {
        playSound("shutdownhold", 0.1);
    }, 100);
}

function stopPowerHoldSound() {
    clearInterval(powerHoldSoundInterval);
    powerHoldSoundInterval = null;
}

function isPowerHoldButton(button) {
    if (!holdPowerEnabled || !button) return false;

    // Yes button in the confirmation dialog
    if (button === powerConfirmYes) {
        return powerConfirmOpen && !!pendingPowerAction;
    }

    // Power menu buttons, but only when prompts are disabled
    return (
        button.matches(".power-option") &&
        !confirmPowerEnabled &&
        powerContainer.classList.contains("open")
    );
}

function beginPowerHold(button) {
    if (!isPowerHoldButton(button) || powerHoldButton) return;

    powerHoldButton = button;
    button.classList.add("hold-active");

    startPowerHoldSound();

    powerHoldTimer = setTimeout(() => {
        if (powerHoldButton !== button) return;

        stopPowerHoldSound();

        button.classList.remove("hold-active");
        powerHoldButton = null;
        powerHoldTimer = null;

        if (button === powerConfirmYes) {
            if (pendingPowerAction) {
                executePowerAction(pendingPowerAction);
            }
        } else {
            executePowerAction(button.dataset.power);
        }
    }, 650);
}

function endPowerHold(button) {
    if (powerHoldButton !== button) return
    
    clearTimeout(powerHoldTimer);
    powerHoldTimer = null;
    stopPowerHoldSound();
    powerHoldButton.classList.remove("hold-active");
    powerHoldButton = null;
}

function cancelPowerHold() {
    if (!powerHoldButton) return;
    endPowerHold(powerHoldButton);
}

// Mouse / pointer input
function bindPowerHold(button) {
    button.addEventListener("pointerdown", () => {
        beginPowerHold(button);
    });

    button.addEventListener("pointerleave", () => {
        endPowerHold(button);
    });

    button.addEventListener("pointercancel", () => {
        endPowerHold(button);
    });
}

powerDropdown.querySelectorAll(".power-option").forEach(bindPowerHold);
bindPowerHold(powerConfirmYes);

document.addEventListener("pointerup", () => {
    if (powerHoldButton) {
        endPowerHold(powerHoldButton);
    }
});

document.addEventListener("pointercancel", cancelPowerHold);

const powerIcons = {
    shutdown: "./Assets/Icons/Shutdown.svg",
    restart: "./Assets/Icons/Restart.svg",
    logoff: "./Assets/Icons/Logoff.svg"
};

function previewPowerAction(option) {
    if (!option) return;

    const action = option.dataset.power;
    const icon = powerIcons[action];

    if (icon) {
        powerButtonIcon.src = icon;
    }
}
function resetPowerIcon() {
    powerButtonIcon.src = powerIcons.shutdown;
}
powerDropdown.addEventListener("click", (e) => {
    e.stopPropagation();

    if (locked || confirming) return;

    const option = e.target.closest(".power-option");
    if (!option) return;

    const action = option.dataset.power;
    if (holdPowerEnabled && !confirmPowerEnabled) return;
    if (confirmPowerEnabled) {
        openPowerConfirm(action);
    } else {
        executePowerAction(action);
    }
    });
// Mouse hover preview
powerDropdown.querySelectorAll(".power-option").forEach(option => {
    option.addEventListener("mouseenter", () => {
        previewPowerAction(option);
    });

    // Keyboard / gamepad focus preview
    option.addEventListener("focus", () => {
        previewPowerAction(option);
    });
});
function closePowerMenu() {
    powerContainer.classList.remove("open");
    powerButton.setAttribute("aria-expanded", "false");
    resetPowerIcon();
}

function openPowerMenu() {
    closeMenu();

    powerContainer.classList.add("open");
    powerButton.setAttribute("aria-expanded", "true");

    powerDropdown.querySelector(".power-option").focus();
}

powerButton.addEventListener("click", (e) => {
    e.stopPropagation();

    if (powerContainer.classList.contains("open")) {
        closePowerMenu();
    } else {
        openPowerMenu();
    }
});

document.addEventListener("click", (e) => {
    if (!powerContainer.contains(e.target)) {
        closePowerMenu();
    }
});
powerContainer.addEventListener("mouseleave", () => {
    resetPowerIcon();
});
document.querySelectorAll(".volume-slider").forEach(slider => {
    slider.addEventListener("keydown", (e) => {
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) {
            e.preventDefault();
        }
    });
});
document.addEventListener("keyup", (e) => {
    if (isBind("left", e.key) || isBind("right", e.key)) {
        stopSliderRepeat();
    }

    if (isBind("confirm", e.key) || isBind("activate", e.key)) {
        if (powerHoldButton) {
            endPowerHold(powerHoldButton);
        }
    }
});

[volumeSlider, systemVolumeSlider].forEach(slider => {
    slider.closest(".volume-control").addEventListener("click", e => {
        if (e.target === slider) return;

        if (slider === volumeSlider) {
            toggleMute(slider, "shellChooserUnmutedVolume", 100);
        } else {
            toggleMute(slider, "shellChooserSystemUnmutedVolume");
        }
    });
});
// Play sound once when the user finishes adjusting a slider.
systemVolumeSlider.addEventListener("change", () => {
    playSound("win10vol");
});

brightnessSlider.addEventListener("change", () => {
    playSound("misc");
});
</script>
